# Gitleaks (CI e uso local). Estende as regras padrão do gitleaks — nunca as substitui — e só
# acrescenta o que é específico daqui: URLs de conexão com senha (Postgres e afins).

[extend]
useDefault = true

[[rules]]
id = "url-com-senha"
description = "URL de conexão com usuário e senha (ex.: postgres://usuario:senha@host)"
regex = '''[a-z][a-z0-9+.-]{2,15}://[^\s:/@'"]+:([^\s@/'"]+)@[^\s'"]+'''
secretGroup = 1
tags = ["password", "url", "database"]

# Valores fictícios conhecidos: senhas descartáveis do CI e marcadores de documentação.
[allowlist]
description = "Valores fictícios conhecidos e seguros"
regexTarget = "secret"
regexes = [
  '''^ci-only-[a-z0-9-]+$''',
  '''^(\.\.\.|\*\*\*|senha|password|SENHA|<[^>]+>|\$\{?[A-Z_]+\}?)$''',
  # Senhas fictícias dos testes (redação do logger e login recusado).
  '''^(senha-super-secreta|senha-secreta|segredo[0-9]|\[redacted\])$''',
  '''^(outra-senha|senha-errada|qualquer-senha|senha-de-teste-longa)-[0-9]+$''',
]
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)package-lock\.json$''',
]
