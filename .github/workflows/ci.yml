name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O build roda com NODE_ENV=production e exige APP_ENV explícito (src/server/env.ts).
      # "test" evita as exigências de production (https, banco) num build de verificação.
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      # Falha em vulnerabilidade alta/crítica nas dependências de produção.
      - run: npm audit --omit=dev --audit-level=high
